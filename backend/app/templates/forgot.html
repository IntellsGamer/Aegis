{% extends 'base.html' %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
  <div class="p-8 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-sm">
    <h1 class="text-xl font-bold mb-2">Reset your password</h1>
    <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">Enter your email and we'll send you a reset link.</p>
    <form id="forgot-form" class="space-y-4" novalidate>
      <div>
        <label class="block text-sm font-medium mb-1" for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email"
               class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-aegis-500">
      </div>
      <button type="submit" class="w-full py-2.5 rounded-lg bg-aegis-600 hover:bg-aegis-500 text-white font-semibold transition disabled:opacity-50" id="forgot-btn">Send Reset Link</button>
      <p class="text-sm text-center text-slate-500">
        <a href="{{ url_for('pages.login') }}" class="text-aegis-600 dark:text-aegis-400 hover:underline">Back to sign in</a>
      </p>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
