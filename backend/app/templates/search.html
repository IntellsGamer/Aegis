{% extends 'base.html' %}
{% block title %}Search{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto">
  <div class="mb-6">
    <h1 class="text-2xl font-bold">Search</h1>
    <p class="text-sm text-slate-500 dark:text-slate-400">Search across your scans and platform threats.</p>
  </div>
  <div class="p-6 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 mb-6">
    <form id="search-form" class="flex gap-2">
      <input type="search" id="search-input" placeholder="e.g. paypal, 09xxxx, phishing domain…"
             class="flex-1 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-aegis-500" value="{{ query or '' }}">
      <select id="search-scope" class="rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 px-3 py-2.5 text-sm">
        <option value="all">Everything</option>
        <option value="scans">My scans</option>
        <option value="threats">Threats</option>
        <option value="users">Users (admin)</option>
      </select>
      <button type="submit" class="px-5 py-2.5 rounded-lg bg-aegis-600 hover:bg-aegis-500 text-white font-semibold transition">Search</button>
    </form>
  </div>
  <div id="search-results"></div>
</div>
{% endblock %}
{% block scripts %}
<script>
  window.__SEARCH_QUERY__ = {{ query|tojson or None }};
</script>
<script src="{{ url_for('static', filename='js/search.js') }}" data-turbo-eval="always"></script>
{% endblock %}
