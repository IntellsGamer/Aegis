name: Build AEGIS Share APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Assemble Android debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aegis-share

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: aegis-share/pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Assemble debug APK
        run: |
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: aegis-share-debug-apk
          path: aegis-share/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  build-compatibility-apk:
    name: Assemble Android compatibility APK
    runs-on: ubuntu-latest
    env:
      AEGIS_COMPAT_BUILD: "1"
    defaults:
      run:
        working-directory: aegis-share

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: aegis-share/pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate compatibility Android project
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Assemble compatibility APK
        run: |
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Upload compatibility APK
        uses: actions/upload-artifact@v4
        with:
          name: aegis-share-compat-apk
          path: aegis-share/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
