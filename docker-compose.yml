version: "3.9"

services:
  app:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      AEGIS_ENVIRONMENT: development
      AEGIS_SECRET_KEY: ${AEGIS_SECRET_KEY:-change-me-in-production}
      AEGIS_DATABASE_URL: postgresql+psycopg2://aegis:aegis@db:5432/aegis
      AEGIS_EMAIL_ENABLED: "false"
      AEGIS_REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
    restart: unless-stopped

  worker:
    build: ./backend
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info
    environment:
      AEGIS_ENVIRONMENT: development
      AEGIS_DATABASE_URL: postgresql+psycopg2://aegis:aegis@db:5432/aegis
      AEGIS_EMAIL_ENABLED: "false"
      AEGIS_REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      POSTGRES_DB: aegis
    volumes:
      - dbdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  dbdata:
